server {
    listen 80;
    server_name _;

    # Path to your Vite build output
    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression for faster load times
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Handle SPA client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent caching for index.html so users always get the latest deployment
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Aggressively cache hashed static assets generated by Vite
    location /assets/ {
        expires 60d;
        add_header Cache-Control "public, max-age=5184000";
        access_log off;
    }
}
